<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Administrativo — SHIMMER JOIAS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/dashboard.css?v=2" />
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <img src="images/logo.png" alt="SHIMMER JOIAS" class="sidebar-logo-img" />
      </div>
      <button class="sidebar-toggle" id="sidebar-toggle">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item active" data-panel="produtos">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        <span>Produtos</span>
      </button>
    </nav>
    <div class="sidebar-footer">
      <a href="index.html" class="back-site">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        Voltar ao site
      </a>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main-content" id="main-content">

    <!-- TOPBAR -->
    <div class="topbar">
      <div class="topbar-left">
        <h1 id="page-title">Produtos</h1>
        <span class="topbar-date" id="topbar-date"></span>
      </div>
      <div class="topbar-right">
        <button class="backup-btn" id="btn-export-backup" title="Salvar backup de todos os dados" onclick="exportBackup()">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Backup
        </button>
        <button class="backup-btn restore" id="btn-import-backup" title="Restaurar backup" onclick="importBackup()">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Restaurar
        </button>
        <div class="user-chip">
          <div class="user-avatar">SJ</div>
          <span>Admin</span>
        </div>
      </div>
    </div>

    <!-- PANEL: PRODUTOS -->
    <section class="panel active" id="panel-produtos">
      <div class="card">
        <div class="card-header">
          <h3>Produtos do Site</h3>
          <button class="btn-sm btn-gold" onclick="abrirModalProduto()">+ Novo Produto</button>
        </div>
        <div id="produtos-lista" class="produtos-admin-lista"></div>
      </div>
    </section>

    <!-- MODAL EDITAR PRODUTO -->
    <div id="modal-produto" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;display:none;align-items:center;justify-content:center">
      <div style="background:#fff;border-radius:16px;padding:32px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;position:relative">
        <button onclick="fecharModalProduto()" style="position:absolute;top:16px;right:16px;background:none;border:none;font-size:22px;cursor:pointer;color:#888">✕</button>
        <h3 id="modal-produto-titulo" style="margin-bottom:24px;font-family:'Cormorant Garamond',serif;font-size:22px">Editar Produto</h3>
        <input type="hidden" id="edit-produto-code" />
        <div style="display:flex;flex-direction:column;gap:14px">
          <div>
            <label style="font-size:12px;font-weight:600;letter-spacing:0.08em;display:block;margin-bottom:6px">CÓDIGO</label>
            <input id="edit-code" type="text" style="width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:14px" placeholder="Ex: SH-1005" />
          </div>
          <div>
            <label style="font-size:12px;font-weight:600;letter-spacing:0.08em;display:block;margin-bottom:6px">NOME DO PRODUTO</label>
            <input id="edit-name" type="text" style="width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:14px" placeholder="Ex: Anel Solitário" />
          </div>
          <div>
            <label style="font-size:12px;font-weight:600;letter-spacing:0.08em;display:block;margin-bottom:6px">COLEÇÃO</label>
            <input id="edit-colecao" type="text" style="width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:14px" placeholder="Ex: Coleção Aurora" />
          </div>
          <div>
            <label style="font-size:12px;font-weight:600;letter-spacing:0.08em;display:block;margin-bottom:6px">MATERIAL</label>
            <input id="edit-material" type="text" style="width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:14px" placeholder="Ex: Ouro 18k · Diamante 0,5ct" />
          </div>
          <div>
            <label style="font-size:12px;font-weight:600;letter-spacing:0.08em;display:block;margin-bottom:6px">PREÇO</label>
            <input id="edit-preco" type="text" style="width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:14px" placeholder="Ex: R$ 4.850,00" />
          </div>
          <div>
            <label style="font-size:12px;font-weight:600;letter-spacing:0.08em;display:block;margin-bottom:6px">PREÇO ORIGINAL (deixe em branco se não tiver desconto)</label>
            <input id="edit-preco-old" type="text" style="width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:14px" placeholder="Ex: R$ 5.500,00" />
          </div>
          <div>
            <label style="font-size:12px;font-weight:600;letter-spacing:0.08em;display:block;margin-bottom:6px">BADGE (ex: Novo, -15%, Exclusivo)</label>
            <input id="edit-badge" type="text" style="width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:14px" placeholder="Ex: Novo" />
          </div>
          <div>
            <label style="font-size:12px;font-weight:600;letter-spacing:0.08em;display:block;margin-bottom:6px">URL DA FOTO</label>
            <input id="edit-foto" type="url" style="width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:14px" placeholder="https://..." />
            <p style="font-size:11px;color:#999;margin-top:4px">Cole o link de uma imagem. Deixe em branco para manter o visual padrão.</p>
          </div>
          <div>
            <label style="font-size:12px;font-weight:600;letter-spacing:0.08em;display:block;margin-bottom:6px">CATEGORIA</label>
            <select id="edit-categoria" style="width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:14px;background:#fff">
              <option value="solitarios">Anéis Solitários</option>
              <option value="aneis">Anéis com Pedras</option>
              <option value="aneis-exclusivos">Anéis Exclusivos</option>
              <option value="aparadores">Aparadores</option>
              <option value="aneis-formatura">Anéis de Formatura</option>
              <option value="aneis-masculinos">Anéis Masculinos</option>
              <option value="brincos">Brincos</option>
              <option value="pulseiras-femininas">Pulseiras Femininas</option>
              <option value="pulseiras-masculinas">Pulseiras Masculinas</option>
              <option value="correntes-femininas">Correntes Femininas</option>
              <option value="correntes">Correntes Masculinas</option>
              <option value="homenagem">Correntes de Homenagem</option>
              <option value="pingentes">Pingentes</option>
              <option value="casamento">Coleções Especiais — Alianças</option>
            </select>
          </div>
        </div>
        <div style="display:flex;gap:12px;margin-top:24px">
          <button onclick="salvarProduto()" style="flex:1;padding:12px;background:#c9a84c;color:#fff;border:none;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer">Salvar Produto</button>
          <button onclick="fecharModalProduto()" style="padding:12px 20px;background:#f0f0f0;color:#555;border:none;border-radius:10px;font-size:14px;cursor:pointer">Cancelar</button>
        </div>
      </div>
    </div>

  </main>

  <script src="js/dashboard.js"></script>
</body>
</html>
